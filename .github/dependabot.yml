# Dependabot version updates (SOC 2 SSDLC, qfg-66ko.3). Weekly; minor and
# patch bumps are grouped into one PR per ecosystem, majors stay separate.
# Security updates are enabled in the repo settings and are not grouped here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
      - nuget
    open-pull-requests-limit: 5
    ignore:
      # FluentAssertions 8+ is commercially licensed by Xceed (6.x/7.x are
      # Apache-2.0). Stay on 6.x; migrate to AwesomeAssertions if we need more.
      - dependency-name: "FluentAssertions"
        versions: [">=8.0.0"]
    groups:
      nuget-minor-patch:
        update-types: ["minor", "patch"]
