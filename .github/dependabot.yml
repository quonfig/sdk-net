# Dependabot version updates (SOC 2 SSDLC, qfg-66ko.3). Weekly; minor and
# patch bumps are grouped into one PR per ecosystem, majors stay separate.
# Security updates are enabled in the repo settings and are not grouped here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
      - nuget
    open-pull-requests-limit: 5
    ignore:
      # FluentAssertions 8+ is commercially licensed by Xceed (6.x/7.x are
      # Apache-2.0). Stay on 6.x; migrate to AwesomeAssertions if we need more.
      - dependency-name: "FluentAssertions"
        versions: [">=8.0.0"]
      # Runtime dependencies of the published packages. A NuGet version is a
      # minimum floor, so a major bump here forces every customer onto that
      # major (e.g. System.* 8 -> 10). Keep floors on the lowest supported
      # band; raise them deliberately in a release, not via Dependabot.
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Serilog"
        update-types: ["version-update:semver-major"]
      - dependency-name: "BouncyCastle.Cryptography"
        update-types: ["version-update:semver-major"]
    groups:
      nuget-minor-patch:
        update-types: ["minor", "patch"]
