name: Chaos

# Runs the cross-SDK single-upstream chaos harness (toxiproxy + scenarios from
# integration-test-data/chaos/scenarios/) against sdk-net. Boots api-delivery
# in fixture mode and drives every scenario in scenarios/*.yaml through it
# (SSE stall, sse-down Layer 2 fallback, reconnect — 01-11). Mirrors the
# sdk-go/sdk-node reference workflows; the failover + ordering corpus runs
# separately in failover-chaos.yaml.
#
# Two modes:
#   - smoke   : skips 11-null-hypothesis (the 30-minute idle scenario);
#               runs on every push to main + every PR (~18 min wall clock).
#   - full    : every scenario; runs on tags + workflow_dispatch (~48 min).
#
# Wired via workflow_call so release automation can `needs:` it.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_call:
    inputs:
      mode:
        description: "smoke (skip 11) or full"
        required: false
        type: string
        default: smoke
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke (skip 11) or full"
        required: false
        type: choice
        options: [smoke, full]
        default: smoke

jobs:
  chaos:
    name: Chaos (${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && 'full' || inputs.mode || 'smoke' }})
    runs-on: ubuntu-latest
    # Smoke ~18 min; full ~48 min. Cap at 75 min to allow for warmup +
    # docker pull. Run will fail fast inside the scenario via its own
    # wall_clock_seconds, so this only kicks in if something hangs.
    timeout-minutes: 75
    # The `secrets` context cannot be referenced in step `if:` conditions, so
    # surface the token's presence as a job-level env var. Dependabot-triggered
    # runs have no access to repo Actions secrets, so HAS_REPO_TOKEN is 'false'
    # for them and the chaos harness steps below are skipped rather than hard
    # failing. Push/tag/dispatch/workflow_call contexts all get the secret.
    env:
      HAS_REPO_TOKEN: ${{ secrets.QUONFIG_REPO_TOKEN != '' }}
    steps:
      - name: Checkout sdk-net
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          path: sdk-net

      - name: Checkout integration-test-data
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          repository: quonfig/integration-test-data
          path: integration-test-data
          # Pinned per the 2026-05-13 reliability audit so the chaos gate moves
          # only when the scenarios are deliberately rev'd. Matches the
          # sdk-go/sdk-node/sdk-ruby/sdk-python chaos.yaml pins — bump alongside
          # the matching SDK change. (failover-chaos.yaml pins a newer tag for
          # its own corpus; the two are independent.)
          ref: v2026.05.13

      - name: Checkout api-delivery
        # api-delivery is private; the default GITHUB_TOKEN cannot read it. A
        # PAT / fine-grained token with read access to quonfig/api-delivery must
        # be configured as the repo secret QUONFIG_REPO_TOKEN. Dependabot runs
        # do NOT have access to repo Actions secrets, so for those the token is
        # empty and the chaos harness is skipped rather than hard failing — the
        # Test workflow still gates the PR.
        if: env.HAS_REPO_TOKEN == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          repository: quonfig/api-delivery
          path: api-delivery
          ref: main
          token: ${{ secrets.QUONFIG_REPO_TOKEN }}

      - name: Setup .NET 8
        if: env.HAS_REPO_TOKEN == 'true'
        uses: actions/setup-dotnet@3e891b0cb619bf60e2c25674b222b8940e2c1c25  # v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Go
        if: env.HAS_REPO_TOKEN == 'true'
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: '1.26'
          cache-dependency-path: api-delivery/go.sum

      - name: Verify docker compose available
        if: env.HAS_REPO_TOKEN == 'true'
        run: docker compose version

      - name: Skipped (no api-delivery access token)
        if: env.HAS_REPO_TOKEN != 'true'
        run: |
          echo "QUONFIG_REPO_TOKEN is not available to this run" \
               "(expected for Dependabot PRs)." \
               "Skipping the chaos harness; the Test workflow still gates this PR."

      - name: Run chaos harness
        if: env.HAS_REPO_TOKEN == 'true'
        working-directory: sdk-net
        env:
          # Smoke skips 11-null-hypothesis (30 min idle). Full suite (tag push
          # or mode=full) runs everything. 'none' is a truthy sentinel that
          # matches no scenario number — the `&& '' ||` ternary the reference
          # workflows use collapses to '11' even when mode=full because '' is
          # falsy in GitHub expressions (gotcha filed as qfg bead).
          CHAOS_SKIP: ${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || inputs.mode == 'full') && 'none' || '11' }}
          DOTNET: dotnet
        run: ./scripts/run-chaos.sh

      - name: Upload chaos logs on failure
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4
        with:
          name: chaos-results-${{ github.run_id }}
          path: |
            sdk-net/tests/**/TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 7
